name: Beast Playlist Fetcher

on:
  schedule:
    - cron: '0 * * * *'  # Runs every hour
  workflow_dispatch: 
  push:
    paths:
      - 'playlist.txt'

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Requests
        run: pip install requests urllib3

      - name: Run Fetcher
        run: python fetcher.py

      - name: Commit and Push All Playlists
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update all individual and merged playlists"
          # This captures every .m3u file in your root directory
          file_pattern: '*.m3u'
